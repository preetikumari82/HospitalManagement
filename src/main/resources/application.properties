spring.application.name=Hospital

# ===============================
# Database Configuration
# ===============================
# DB_URL example for a managed MySQL host:
# jdbc:mysql://<host>:<port>/<database>?useSSL=true&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================
# Render (and most PaaS hosts) inject PORT at runtime; 8080 is used locally.
server.port=${PORT:8080}

jwt.secret=VGhpc0lzQVNlY3JldEtleUZvckpXVFRlc3QxMjM0NTY3ODkwMTIzNDU2
jwt.expiration=${JWT_EXPIRATION_MS:3600000}


admin.name=${ADMIN_NAME:Hospital Admin}
admin.email=${ADMIN_EMAIL:admin@hospital.com}
admin.password=${ADMIN_PASSWORD:admin123}

# ===============================
# SMTP / Email Configuration
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Address emails are sent "from" (defaults to the SMTP username if unset)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# How long a password reset OTP stays valid, in minutes (FR1.5)
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# ===============================
# CORS - comma separated list of allowed frontend origins
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hospital-management-bfvxx167d-preetikumari82.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173}
