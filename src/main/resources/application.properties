spring.application.name=Hospital

# =========================================================
# DATABASE - AIVEN MYSQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# =========================================================
# JPA / HIBERNATE
# =========================================================

# IMPORTANT: Use update in production.
# Do NOT use create because it can recreate/drop database schema.
spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# SERVER - RENDER
# =========================================================

# Render provides PORT automatically.
server.port=${PORT:8080}

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# =========================================================
# ADMIN
# =========================================================

admin.name=${ADMIN_NAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# =========================================================
# EMAIL / GMAIL SMTP
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender address
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# =========================================================
# OTP
# =========================================================

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
